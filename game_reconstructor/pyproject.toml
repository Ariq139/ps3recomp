[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-game-reconstructor"
version = "0.1.0"
description = "Offline Ghidra analysis and validated game reconstruction"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
game-reconstructor = "reconstructor.cli:main"

[project.gui-scripts]
offline-game-reconstructor = "reconstructor.cli:gui_main"

[tool.setuptools.packages.find]
include = ["reconstructor*"]

[tool.setuptools.package-data]
reconstructor = ["profiles/*.json"]
